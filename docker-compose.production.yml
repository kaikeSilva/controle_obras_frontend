services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile.production
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    image: kaikesilva/controleobrasfrontend:latest
    env_file:
      - .env
    ports:
      - "5200:80"
    restart: unless-stopped
